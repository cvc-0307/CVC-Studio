<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVC-Studio</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; background-color: #eef2f7; padding: 50px; margin: 0; }
        .profile-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: inline-block; max-width: 400px; width: 90%; }
        h1 { color: #222; margin-bottom: 5px; }
        .sub-title { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .gear-box { background: #f8f9fa; padding: 15px; border-radius: 12px; margin: 20px 0; border-left: 4px solid #007bff; }
        .gear-info { color: #007bff; font-weight: bold; font-size: 0.95em; }
        .message { font-style: italic; color: #444; margin: 20px 0; }
        .footer { margin-top: 30px; font-size: 0.8em; color: #bbb; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="profile-card">
        <h1>CVC-Studio</h1>
        <p class="sub-title">Furry Photographer & Enthusiast</p>
        <hr>
        <p>📸 <b>Canon EOS R10</b></p>
        <div class="gear-box">
            <p class="gear-info">RF-S 18-45mm IS STM</p>
            <p class="gear-info">RF 50mm f1.8 STM</p>
        </div>
        <p class="message">"최고의 액팅을 최고의 한 컷으로 담아냅니다."</p>
        <hr>
        <p style="font-size: 0.9em; color: #555;">📍 다음 행사를 기다리는 중...</p>
        <div class="footer">© 2026 CVC-0307. Powered by GitHub</div>
    </div>
</body>
</html>
